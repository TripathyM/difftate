<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>difftate</title>
<!-- Layout D, difftate's browser viewer-to-be, beside today's (../index.html): a client of the
     review API (../../server.py). Each part's model is a DOM-free module; the draw_*.js modules
     only draw them, and main.js starts it all. -->
<link rel="stylesheet" href="/d/style.css">
</head>
<body>
<div class="appbar">
  <span>difftate</span>
  <button type="button" id="flip-theme" class="tool"></button>
  <button type="button" id="open-settings" class="tool" popovertarget="settings" title="Settings" aria-label="Settings"></button>
</div>
<div id="settings" class="settings" popover aria-label="Settings">
  <div class="setting-title" id="layouts-title">Diff layout</div>
  <div id="layouts" class="modes" role="group" aria-labelledby="layouts-title"></div>
  <div class="setting-title">Theme</div>
  <label class="check"><input type="checkbox" id="follow-system"> Follow the system</label>
  <div id="agent-setting" class="agent-setting" hidden>
    <label class="setting-title" for="agent">Coding agent</label>
    <select id="agent" title="Which coding agent replies in this review. Default: the repository's agent, else the machine's. Pick another to use it for this review only."></select>
  </div>
</div>
<header class="review-head">
  <div class="head-row">
    <div id="review"></div>
    <div id="controls" class="controls">
      <div id="actions" class="actions"></div>
      <button type="button" id="open-more" class="btn" popovertarget="more" title="More actions" aria-label="More actions" hidden>⋯</button>
      <div id="more" class="menu" popover aria-label="More actions">
        <button type="button" id="export" class="menu-item" title="Copy the review (commit messages, every thread, how to reply) to paste into an agent session you start">Export</button>
      </div>
      <section id="submit-panel" class="submit-panel" tabindex="-1" aria-label="Submit review" hidden>
        <div class="panel-head"><b>Submit review</b><button type="button" id="submit-close" class="link" data-focus="submit-close">Close</button></div>
        <div id="held" class="held-list"></div>
        <div id="summary"></div>
      </section>
    </div>
  </div>
  <nav id="tabs" class="tabs"></nav>
</header>
<div id="problem" class="flash" role="status" hidden></div>
<div id="waiting" class="flash" role="status" hidden></div>
<div id="warnings" role="status"></div>
<div id="why" class="flash why" role="status" hidden></div>
<div id="notice" class="flash why" role="status" hidden></div>
<p id="loading" class="blank">Loading the review…</p>
<main id="files-tab" hidden>
  <div class="toolbar">
    <button type="button" id="view-button" class="btn" popovertarget="view-menu" title="Choose the view (c)"></button>
    <div id="view-menu" class="menu" popover aria-label="Choose the view">
      <div id="view-choices"></div>
      <label class="setting-title" for="commit">The commits after a commit</label>
      <input id="commit" placeholder="A commit, then Enter" autocomplete="off" spellcheck="false">
    </div>
    <span id="comments-hidden" class="muted" hidden>Comments are hidden <button type="button" id="show-comments" class="link" title="i">Show</button></span>
    <span id="progress" class="progress"></span>
  </div>
  <div class="columns">
    <aside class="sidebar">
      <div id="sort" class="sort" role="group" aria-label="Sort files"></div>
      <p id="outdated" class="outdated" role="status" hidden></p>
      <input id="filter" type="search" placeholder="Filter files…" aria-label="Filter files" title="t">
      <p id="filtered" class="muted" hidden></p>
      <nav id="tree" aria-label="Changed files"></nav>
    </aside>
    <div class="diffs">
      <div id="loose" class="comments" hidden></div>
      <p id="empty" class="blank" hidden></p>
      <div id="files"></div>
    </div>
  </div>
</main>
<main id="conversation-tab" hidden>
  <p id="no-threads" class="blank" hidden></p>
  <div id="timeline" class="comments"></div>
  <div id="general" class="comments"></div>
</main>
<script type="module" src="/d/main.js"></script>
</body>
</html>
