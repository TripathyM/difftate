name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python, and the newest
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The watcher tests run against a real diffity, pinned like the install guide
      - run: npm install -g diffity@0.9.5
      - run: python -m unittest discover -s tests -v

  # ShellCheck has no zsh support, so the one shell file gets zsh's own syntax check
  zsh-syntax:
    name: zsh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq zsh
      - run: zsh -n difftate.zsh
