name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    # Ubuntu 26.04 (ubuntu-latest since October 2026) has no Python 3.9 build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python, and the newest
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  # ShellCheck has no zsh support, so the one shell file gets zsh's own syntax check
  zsh-syntax:
    name: zsh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq zsh
      - run: zsh -n difftate.zsh
